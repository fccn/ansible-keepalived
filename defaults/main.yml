---

keepalived_packages:
  - "keepalived"

keepalived_health:
  name: chk_script
  script: "service docker start"
  interval: 2
  timeout: 3

# Kept for backward compatibility only -- the role now resolves each vrrp_instance's interface
# internally (per-instance, via unicast_src_ip/ansible_host IP-matching), so this is unused in-repo.
keepalived_connected_network_interface: "{% for interface in ansible_interfaces %}{% if hostvars[inventory_hostname]['ansible_' + interface]['ipv4']['address'] == ansible_host %}{{ interface }}{% endif %}{% endfor %}"

# Required variable, not defined because it is required to be defined to put keepalived weel configured.
# Also with it comment by default it is possible to run the role only if this variable is defined.
