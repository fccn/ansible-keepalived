---

keepalived_packages:
  - "keepalived"

keepalived_health:
  name: chk_script
  script: "service docker start"
  interval: 2
  timeout: 3

# Kept for backward compatibility only -- the role now resolves each vrrp_instance's interface
# internally (per-instance, via unicast_src_ip/ansible_host IP-matching), so this is unused in-repo.
keepalived_connected_network_interface: "{% for interface in ansible_interfaces %}{% if hostvars[inventory_hostname]['ansible_' + interface]['ipv4']['address'] == ansible_host %}{{ interface }}{% endif %}{% endfor %}"

# Options of keepalived's global_defs block, as `option: value`. Empty by default, so keepalived
# uses its own defaults. Single values only: `true`, `null` or "" writes the option alone, which
# turns it on (many options, like vrrp_strict, take no value and are turned on by any value, even
# the string "false"); `false` leaves the option out; text and numbers are written as they are.
# For example, so that the MASTER announces its VIPs again after the adverts were lost in both
# directions (see the README):
# keepalived_global_defs:
#   vrrp_higher_prio_send_advert: true    # when a MASTER steps down, so the other MASTER announces
#   vrrp_garp_master_refresh: 60          # every 60 s while MASTER
#   vrrp_garp_master_refresh_repeat: 2
keepalived_global_defs: {}

# Drop the traffic that reaches this host for one of its VIPs while another node holds it, so
# that a client that kept this host's MAC for the VIP stops getting answers and finds the holder.
# Installs /usr/local/sbin/keepalived-vip-guard, run before keepalived starts. IPv4 VIPs use
# iptables and IPv6 VIPs ip6tables. Setting it back to false removes the script and its rules.
# See the README.
keepalived_vip_guard: false

# Restart keepalived even if its configuration did not change. A changed configuration is applied
# with a reload, or with a restart when keepalived_priority_override is set. See the README.
keepalived_service_force_restart: false

# Required variable, not defined because it is required to be defined to put keepalived weel configured.
# Also with it comment by default it is possible to run the role only if this variable is defined.
# keepalived_vrrp_instances:
#   - name: failover_link
#     ipv6: false
#     state: MASTER
#     id: 51
#     priority: 200
#     pass: password
#     peer_ip: "CHANGEME"
#     track_script: chk_script
#     # interface: enp6s18 # optional, overrides the auto-detected interface for this instance
#     virtual_ip: 
#       - "CHANGEME"
